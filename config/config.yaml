# ============================================================
# Central configuration — ALL knobs live here.
# No hardcoded tickers, dates, paths, or thresholds anywhere in src/.
# All timestamps are UTC everywhere; convert at display time only.
# ============================================================

paths:
  db: "data/db/footprints.db"
  edgar_raw: "data/raw/edgar"        # every EDGAR JSON response, cached forever
  processed: "data/processed"        # events.parquet + feature matrices

http:
  # SEC requires a descriptive User-Agent with a contact address, and caps
  # traffic at 10 requests/second. That is the entire terms of service.
  #
  # The real address is NOT stored here, because this repository is public.
  # Two reasons, and the second is the one that matters:
  #   1. a committed address is scraped for spam;
  #   2. anyone who clones or forks this would send OUR address to the SEC,
  #      so their rate-limit violations would be attributed to us.
  # Set SEC_USER_AGENT in your .env (see .env.example) — the loader prefers it
  # over the placeholder below, and the EDGAR client refuses to start if the
  # placeholder is all it has, rather than letting the SEC block you later.
  user_agent: "SET-SEC_USER_AGENT-IN-YOUR-ENV (unset@example.invalid)"

# ------------------------------------------------------------
# Rate limiting — shared across every collector's Backoff (src/utils/ratelimit.py)
# ------------------------------------------------------------
ratelimit:
  # Ceiling on any collector's backoff sleep, no matter how many consecutive
  # failures or how large its own `backoff_base_s`. Previously hardcoded as a
  # Python default (never sourced from config), which violated the "no
  # hardcoded rate limits" rule. 3600.0 is the value that default already
  # had, kept as-is so this doesn't silently change collector behaviour.
  backoff_cap_s: 3600.0

# The study window.
#
# SHORTENED 2026-08-29, from 2024-09-01, by decision. Finnhub's free tier
# serves only ~12 months of news (earliest article obtainable anywhere:
# 2025-09-03), so under the old window 49,539 of 97,518 in-window 8-Ks — 51% —
# could never receive the news-based t0 correction, which is this project's
# headline contribution. A clean claim over eleven months beats a caveated one
# over twenty-three. ~48,000 8-Ks remain.
#
# The old start was set by yfinance's ~2-year hourly history; the new one is
# well inside it, so price coverage stops being a constraint.
study_window:
  start: "2025-09-01"
  end: "2026-08-01"

# ------------------------------------------------------------
# Universe (review §7.1, §7.5)
# ------------------------------------------------------------
universe:
  company_tickers_url: "https://www.sec.gov/files/company_tickers_exchange.json"
  exchanges: [Nasdaq, NYSE]
  min_price_usd: 5.0
  min_adv_usd: 5000000             # average daily traded value
  min_history_days: 365
  max_tickers: 1500
  # ADV is a mean, so it needs a denominator worth trusting: a name that traded
  # four days all year would otherwise rank above every real company. ~250 US
  # sessions fall in a 365-day lookback, so 200 is four fifths of a year.
  min_bars_in_lookback: 200
  # The company must still have been trading when the window opened — a name
  # delisted months BEFORE the start is not a member, it is history. Ten days
  # clears the longest US holiday closure (four sessions) with margin.
  max_bar_staleness_days: 10
  # P3-02b. Foreign private issuers (TSM, BABA, ASML, ARM, SAP, BP...) file
  # 6-K and 20-F and are EXEMPT from 8-K; ETFs (SPY, QQQ, DIA, MDY) file none.
  # 191 of the first 1,500-company universe were such entities: they can never
  # produce a positive, they displace real filers because the universe is
  # capped, and they deflate the measured base rate.
  #
  # Measured BEFORE the window, never during it. "Filed an 8-K in the window"
  # would build the universe out of the outcome and hand every member a
  # guaranteed positive. The pre-window form costs 4 domestic companies that
  # first filed mid-window — the honest price of owing nothing to the future.
  #
  # A knob, not a hardcoded rule: "what happens if you keep them?" is a fair
  # review question and should cost one line to answer.
  require_prior_8k: true
  # ...and filed one RECENTLY. Without a lower bound the rule reads "ever filed
  # an 8-K since 1994", which QQQ satisfies on two administrative filings from
  # 2014 while sitting at #3 by ADV. Measured strictly before the window, like
  # the rule above. A year, because a domestic operating company files several
  # 8-Ks a year and silence that long marks a trust or a shell: on the built
  # universe it drops 14 members (QQQ, UUP, BAR, GLD, SLV, IAU, SGOL, SIVR,
  # PPLT, OUNZ, GLDM, IAUM, DBC and one issuer that has filed nothing since
  # 2023), which between them filed 12 in-window 8-Ks — all trust
  # administration — and admits 14 operating companies that filed 129.
  prior_8k_lookback_days: 365
  # The liquidity filter is applied using data as of study_window.start, never
  # today's — a universe built from today silently drops every company that was
  # acquired or delisted, which is exactly the dramatic events we care about.
  as_of: "start"

# ------------------------------------------------------------
# EDGAR (review §1)
# ------------------------------------------------------------
edgar:
  submissions_base: "https://data.sec.gov/submissions"
  archives_base: "https://www.sec.gov/Archives/edgar"
  # 8-K/A is an amendment to an 8-K — a real filing with its own acceptance
  # time, so it is an event in its own right. Matched exactly, never by prefix:
  # startswith("8-K") would also swallow forms like 8-K12B.
  forms: ["8-K", "8-K/A"]
  max_requests_per_s: 8            # SEC allows 10; stay under it
  min_interval_s: 0.125
  # P2-11. Form 8-K12B is "registration of securities of successor issuers" —
  # a company declaring in a filing that it continues another. It is the only
  # unambiguous marker we have: of 423 CIKs with no history before the window,
  # exactly 11 filed one, and the other 412 are ordinary new listings.
  successor_forms: ["8-K12B", "8-K12G3"]
  cik_lookup_url: "https://www.sec.gov/Archives/edgar/cik-lookup-data.txt"
  max_retries: 5                   # then give up and name the URL — a permanent
                                   # 404 must not spin forever inside a
                                   # 1,500-company run
  backoff_base_s: 2.0              # SEC throttling clears in seconds. The
                                   # project-wide Backoff default (60s) is tuned
                                   # for daily API quotas and would cost ~5 min
                                   # per transient 429 here.

# ------------------------------------------------------------
# Event filtering (context.md §5)
# ------------------------------------------------------------
items:
  # 9.01 is an attachment marker, not an event type — it rides along with other
  # items and would dominate the label distribution if kept.
  # 5.07 (shareholder vote results) is excluded as routine paperwork, per
  # implementation_plan.md §5. It was ALSO listed under `scheduled` below,
  # which is unreachable — exclusion runs first — so the report announced 5.07
  # as a scheduled code while every 5.07 filing was in fact either dropped or
  # called a surprise. The two lists must stay disjoint; events.py now refuses
  # to run if they overlap.
  exclude: ["9.01", "5.07"]
  # Known in advance (dates published weeks ahead). Kept, but every headline
  # number is reported split scheduled vs unscheduled, never pooled.
  scheduled: ["2.02"]
  # Genuinely unscheduled and market-moving — the real target.
  unscheduled_focus: ["1.01", "5.02", "8.01", "2.03", "7.01", "1.03", "2.01",
                      "4.01", "4.02", "5.01"]

# The positive-count census (P4-05). Thresholds live here, not in source.
census:
  # Issue 28: events are not announcements. Reported at several gaps because
  # the right one is a judgement, and the sensitivity is the honest answer.
  cluster_gap_hours: [6, 24, 72]
  # implementation_plan.md §5: "Plan for ~3,000-5,000 usable positives."
  # Below the minimum is a stop-and-tell, not something to absorb quietly.
  expected_usable_min: 3000
  expected_usable_max: 5000

materiality:
  # An 8-K only counts as a positive if the market actually reacted. Without
  # this, routine dividend declarations and credit-facility amendments become
  # "positives" and the target is mostly noise.
  window_hours: 24                 # measured from t0 forward
  min_abs_return: 0.03             # |return| vs the last pre-t0 close
  benchmark_relative: true         # subtract the benchmark's move over the same span

# ------------------------------------------------------------
# Market data (review §7.7, context.md §6)
# ------------------------------------------------------------
market:
  interval: "60m"                  # hourly bars = the decision granularity
  daily_interval: "1d"
  benchmark: "SPY"
  min_interval_s: 1.0
  pad_days_before: 30              # bars must cover [t0 - 30d, t0 + 5d] per event
  pad_days_after: 5
  # Slack allowed at each end of the required span by the coverage report. A
  # boundary date can legitimately land on a weekend or in a holiday week and
  # have no bar. The longest run of consecutive non-trading days in the US
  # calendar is four (Christmas/New Year midweek), so a week leaves margin
  # without being loose enough to hide a real gap.
  coverage_tolerance_days: 7
  # P3-05. Fraction of exchange sessions in an event's padded span that must
  # carry at least one bar. Measured in SESSIONS, not bars: a 09:30-16:00
  # session yields 7 bars (six hours plus the 15:30 half-hour stub) against 6.5
  # trading hours, so a bar-count ratio scores a perfect event at 1.077 and the
  # threshold would absorb an artefact instead of measuring a gap.
  #
  # 0.9 because a 35-day span holds ~24 sessions, so this tolerates two missing
  # days — enough for a one-day halt or a data hiccup, tight enough that a
  # week-long hole fails. 1.0 would flag every early close where the final stub
  # bar is absent.
  min_session_coverage: 0.9
  # Hourly history is a ROLLING ~2-year window: bars available today disappear
  # later. Download broad coverage early, freeze it, and never re-download.
  # FROZEN 2026-08-30 (P3-06). Stamps live in `meta` as snapshot_frozen_1d /
  # snapshot_frozen_60m. The collector now refuses any run whose REQUESTED
  # start predates its interval's stamp, because bars are fetched with
  # auto_adjust=True and yfinance restates history after a split — a re-pull
  # would silently rewrite bars already used in results. Appending newer bars
  # is still allowed, so the Phase 7 live monitor keeps working. --force is the
  # deliberate override.
  snapshot_frozen: true
  # yfinance's limit, not ours: it serves roughly 730 days of intraday bars and
  # refuses (or silently truncates) anything older, so a request that reaches
  # further back is clamped to this floor. 729 rather than 730 keeps a day of
  # margin against the boundary moving while a multi-hour run is in flight.
  # Applied only to `interval` above — daily bars have no such ceiling.
  hourly_max_lookback_days: 729
  calendar: "XNYS"                 # exchange_calendars code for NYSE/Nasdaq hours

# ------------------------------------------------------------
# News — LABEL infrastructure, not a feature source (context.md §2)
# ------------------------------------------------------------
news:
  # t0 = min(8-K acceptanceDateTime, earliest article for that ticker/event).
  # Companies wire a press release first and file the 8-K minutes-to-hours
  # later; using acceptance time alone inflates every lead-time number.
  # CHANGED 2026-08-31, 24h -> 3h, on the user's decision (issue 27).
  # MEASURED over 16,842 in-universe filings: at 24h, 78.9% matched but the
  # MEDIAN gap was 9.9h and only 6% landed within 2h — where a wire release
  # actually sits. A 24h window on a liquid stock nearly always contains SOME
  # article, so taking the earliest matched unrelated daily coverage: Agilent's
  # "earliest article" was a lithium-mining roundup, then a different company's
  # earnings, then an analyst note.
  #
  # The bias direction was conservative (an early t0 shortens measured lead
  # times) but it made t0 ARBITRARY — two identical events getting different t0
  # depending on whether unrelated coverage happened to exist. Noise in the
  # label, not a safe margin.
  #
  # Alternatives measured (matched / median gap): 2h 46.8% / 0.4h ·
  # 3h 51.4% / 1.0h · 4h 59.6% / 3.3h · 6h 65.9% / 4.0h · 24h 78.9% / 9.9h.
  # 3h keeps a plausible release-to-filing interval while staying wide enough
  # for a release issued a couple of hours ahead. Events that no longer match
  # fall back to filing time — the uncorrected default all prior work uses.
  t0_lookback_hours: 3             # how far before acceptance to search for the release
  # Where --report buckets the matched articles inside that window, as
  # FRACTIONS of t0_lookback_hours. Fractions, not fixed hours: a gap can never
  # exceed the lookback, so the old fixed 2h/6h/12h edges went dead the moment
  # the window narrowed to 3h — "beyond 6h: 0%" was a tautology, not a finding.
  gap_bucket_fractions: [0.25, 0.5, 0.75]
  # Seed watchlist for phase 1. news.py needs company names from `companies`
  # for its GDELT query, and that table is not populated until P2-02 — so
  # collection starts against a hand-picked list and P2-09 swaps in the real
  # universe. Liquid, well-covered names across several sectors, chosen so the
  # collector is exercised rather than to be representative.
  seed_watchlist: [AAPL, MSFT, TSLA, JPM, PFE, XOM, WMT, NVDA]

  finnhub_base: "https://finnhub.io/api/v1"
  finnhub_min_interval_s: 1.1      # free tier ~60 calls/min
  # MEASURED 2026-08-29: /company-news caps a response at ~245 articles and
  # returns the NEWEST ones. Asking TSLA for 2025-09-01..2026-08-29 returned
  # 242 articles, all from 2026-08-11 onward — a year requested, a fortnight
  # delivered, HTTP 200, no warning. Long ranges are chunked into windows this
  # size so nothing is lost silently.
  max_window_days: 7
  default_lookback_days: 7         # a daily run collects the last week
  # MEASURED 2026-08-29: nothing before ~2025-09-03 is served on the free tier,
  # and the cutoff rolls forward daily. This is the measurement that shortened
  # `study_window` — see the note there. The window start now sits just inside
  # the cutoff, with only days of margin, so news must keep being collected.
  history_days: 365
  gdelt_base: "https://api.gdeltproject.org/api/v2/doc/doc"
  gdelt_min_interval_s: 5.0        # unreliable under load — breadth only, never a dependency
  max_records: 75
  backoff_base_s: 15.0             # first retry delay on a 429/503 or a request
                                   # error, from either API; doubles per attempt
                                   # (see src/utils/ratelimit.py Backoff). Mirrors
                                   # edgar.backoff_base_s — same pattern, same key
                                   # shape, so it is not a hardcoded threshold.
  max_retries: 5                   # attempts per (ticker, window) against GDELT
                                   # and Finnhub before giving up on that pair
                                   # and moving on. 5 was the value hardcoded in
                                   # both fetchers, kept unchanged so behaviour
                                   # does not move — it is here so a run against
                                   # a flaky endpoint can be made more or less
                                   # patient without editing code. Mirrors
                                   # edgar.max_retries.
  # What "the news is public" means for the t0 correction — TIERED, because a
  # wire-only list would apply to almost nothing on free data.
  #
  # Measured 2026-08-26: Finnhub's free tier returned NO wire services across
  # 1,080 articles / 5 tickers (Yahoo, Benzinga, SeekingAlpha, ChartMill, CNBC,
  # Fintel), and GDELT was unreachable. Only CNBC matched the old list: 3%.
  #
  # Phase 4 reports t0 under tier 1 only AND tier 1+2, with the gap between
  # them, so this choice is measured rather than assumed.
  #
  # Entries may be written as a domain or as a publisher name — both are
  # normalised to a stem (lowercase, TLD dropped, non-alphanumerics stripped),
  # so "reuters.com" and "Reuters" are the same publisher. Keep stems distinctive:
  # a very short one like "ft" could in principle collide.
  whitelist_tier1:   # the release itself: wires and top-tier outlets
    [prnewswire.com, businesswire.com, globenewswire.com, accesswire.com,
     reuters.com, bloomberg.com, apnews.com, wsj.com, ft.com, sec.gov]
  whitelist_tier2:   # fast republishers of wire copy — usually within minutes
    [CNBC, Benzinga, Yahoo, SeekingAlpha, MarketWatch, Barrons, Reuters Institute]

# ------------------------------------------------------------
# Features (review §7.2 — every statistic backward-looking only)
# ------------------------------------------------------------
features:
  return_horizons_h: [1, 4, 24, 120]
  # CORRECTED 2026-08-31 (issue 30). This is 480 BARS, which is ~69 trading
  # days, not the "~20 trading days" this comment used to claim. The old figure
  # came from 480/24, which would only hold if bars existed around the clock;
  # they exist for the 6.5-hour session, ~6.97 bars a day. Twenty trading days
  # would be 139 bars.
  #
  # 480 kept on the user's decision: a ~69-day baseline gives a more stable
  # estimate of "normal" and is less easily dragged by a recent quiet or busy
  # patch. min_baseline_bars below means a score still starts after 17 sessions.
  volume_zscore_window_h: 480      # ~69 trading days (480 bars / 6.97 per session)
  volatility_window_h: 120
  min_baseline_bars: 120           # below this the z-score is undefined; skip the hour
  include_benchmark_relative: true
  include_days_since_last_8k: true
  include_earnings_proximity: true

  # P8-01 news-coverage features. OFF by default, and that default is the
  # experiment: Phase 8 asks whether the news channel adds anything, so the
  # "without" arm has to be the baseline every earlier phase already ran.
  # Flipping this flag is the whole of P8-02 — nothing else may differ, not
  # the seeds, not the split, not the budget.
  include_news_coverage: false
  # 24 h is "since yesterday's session", 168 h a full week — the same span
  # `sampling.quiet_gap_hours` uses to decide a window is quiet, so a quiet
  # window's coverage count is measured over exactly the period that made it
  # quiet.
  news_windows_h: [24, 168]
  # Same credibility ceiling as the t0 correction (`events:t0_max_tier`). A
  # coverage feature that counted sources the t0 rule rejects would make the
  # ablation measure the gap between two whitelists, not the news channel.
  news_max_tier: 2

# ------------------------------------------------------------
# Sampling (review "Day 9" — fix this now, report two ratios)
# ------------------------------------------------------------
sampling:
  # DECIDED 2026-09-01 (issue 33). Was 20. Only ~3.5:1 of genuinely quiet
  # windows EXISTS: 23,634 against 6,737 positives, and 20:1 would need
  # 134,740. The binding constraint is tiling, not the gap — non-overlapping
  # 48-bar windows are all the calendar holds — so loosening
  # `quiet_gap_hours` does not rescue it (12h reaches only 6.3:1) and would
  # cost the contamination guarantee that closed issue 28.
  #
  # The alternative was sliding rather than tiling, which manufactures
  # negatives that share 47 of 48 bars with their neighbours: more rows, no
  # more information, and a model free to memorise one quiet afternoon. So
  # the ratio is set to what the data actually supports and the ceiling is
  # reported as a measured limitation rather than papered over.
  #
  # 3, not 3.5: the shortfall must be zero at the configured ratio, or the
  # drawn sample silently stops being the ratio it claims to be.
  negatives_per_positive: 3        # training only — the measured ceiling
  keep_true_base_rate_in_eval: true
  # Nested, and all BELOW the ~3.5:1 ceiling so the three samples are
  # genuinely different draws rather than three names for one exhausted pool.
  # The old [10, 40] both exceeded what exists, so every ratio returned the
  # same capped set and the robustness check compared a sample with itself.
  robustness_ratios: [1, 2]        # re-report at these so nobody can call it tuned
  quiet_gap_hours: 168             # a negative window must be this far from any filing
  # Measured from EVERY filing, not just usable events. That is what stops a
  # quiet window landing beside an immaterial 8-K and being labelled "nothing
  # happening" when something did — and it resolves issue 28's clustering for
  # free, since a cluster's filings are themselves filings.
  seed: 42                         # which negatives get drawn must be
                                   # reproducible, or the robustness ratios
                                   # compare three unrelated samples instead of
                                   # nested ones

# ------------------------------------------------------------
# Decision problem — sequential change detection / optimal stopping
# ------------------------------------------------------------
decision:
  horizon_hours: 48                # T_max: hours before t0 the agent may act in
  actions: [WAIT, FLAG]
  lead_time_unit: trading_hours    # never wall-clock — most 8-Ks land after the close

reward:
  r_correct_flag: 1.0
  r_early_bonus: 0.5               # scaled by remaining trading hours to t0
  r_false_alarm: -2.0
  # CHANGED -0.02 -> -0.005 on 2026-09-04 (P6-04), after the first real training
  # run flagged on 94% of steps. Not a tuning tweak — the old value flattened
  # the reward landscape, which `python -m src.rl.monitor --sweep` shows:
  #
  #   r_wait   wait/window   always-FLAG   always-WAIT     gap
  #   -0.020       -0.960       -1.1250       -1.0850    0.0400   <- flat
  #   -0.005       -0.240       -1.1250       -0.3650    0.7600
  #
  # At -0.02, sitting out a 48-bar window cost -0.96 against a -2.0 false
  # alarm: 48% of being wrong. The two degenerate strategies then paid within
  # 0.04 of each other — less than PPO's batch-to-batch noise — so an agent
  # that cannot yet discriminate is INDIFFERENT between flagging everything and
  # flagging nothing, and drifts to whichever its parameters happen to favour.
  # At a 0.46% evaluation base rate the default when uncertain must be WAIT.
  # -0.005 costs an eighth of a false alarm per window: waiting is not free,
  # and it is clearly cheaper than being wrong. Derived, not guessed —
  # `suggest_r_wait` states the criterion and a test pins that config follows it.
  r_wait: -0.005
  r_missed: -0.5

# ------------------------------------------------------------
# Baselines — all four must be genuinely tuned (context.md §4)
# ------------------------------------------------------------
baselines:
  # Knobs shared by every baseline, read by src/baselines/base.py. They live
  # here rather than being repeated per baseline because they govern the
  # comparison itself, not any one detector.
  common:
    # What to do with a window no baseline feature can score — issue 32's 234
    # positive windows are all-NaN on volume_z, having fewer than
    # features.min_baseline_bars bars behind them.
    #   rank_last — score it below every real score, keep it in the denominator
    #   error     — raise, for a baseline that ought to score everything
    # rank_last is the default because dropping such windows would raise
    # precision without detecting anything, and would leave volume z-score
    # scored on a smaller window set than always-quiet, so the two rows of the
    # P5-06 table would not be about the same task.
    unscoreable: rank_last
    # Trading hours at the start of a window during which a FLAG is refused.
    # 0 = no restriction, the default: the alert budget already prices a false
    # alarm, so suppressing early flags outright would hide a detector that is
    # genuinely early. volume_zscore.min_wait_hours overrides this per baseline
    # where P5-03's tuning calls for it.
    min_wait_hours: 0
  always_quiet:
    # The constant every hour is scored. The VALUE is arbitrary by
    # construction: a constant ranker is uninformative at any level, so
    # precision at budget comes out equal to the base rate whatever this is.
    # It lives here only to keep a bare literal out of src/; changing it must
    # not change any reported number, and a test pins exactly that.
    score: 0.0
  volume_zscore:
    # OUTPUTS of P5-03's tuning on validation 2026-09-04, not guesses. The run
    # is in work-log entry 52: 314,694-window eval frame, precision 0.0845
    # against a 0.0046 floor (18.3x), median lead 22.3 trading hours.
    # The threshold is the budget-implied cut, not a searched value — precision
    # at the alert budget is rank-based and does not move with it.
    # Notably close to the 2.5 that was originally guessed.
    threshold: 2.648
    # 0 won the sweep: the alert budget already prices a false alarm, so
    # suppressing early flags only cost precision here.
    min_wait_hours: 0
    # Swept on validation. Bounded by the 48-bar decision horizon: waiting
    # longer than the window is identical to never flagging, which
    # always_quiet already measures as the floor.
    min_wait_hours_grid: [0, 1, 2, 4, 8]
  cusum:
    # Classical quickest-change-detection. Built BEFORE the learned agent so
    # there is a real number to beat, and so a null result means something.
    # OUTPUTS of P5-04's 42-point sweep on validation 2026-09-04 (work-log 53):
    # precision 0.08616 vs a 0.00461 floor = 18.7x, recall 0.532, median lead
    # 23.6 trading hours. Both are interior maxima of their bracketed grids.
    drift: 1.5                     # k — the slack parameter
    threshold: 1.0                 # h — decision boundary; with reset_after_alarm
                                   # on, this is part of the ESTIMATOR, not just
                                   # an alarm rule, because crossing it zeroes S
    reset_after_alarm: true
    # Swept as a 2-D grid on validation. BOTH matter here, unlike P5-03 where
    # the threshold provably could not move precision: reset_after_alarm
    # couples h back into the estimator, so crossing it zeroes S and changes
    # every later value the metric ranks on.
    # k around 0.5 is the textbook choice for detecting a one-sigma shift and
    # the grid brackets it. h is bounded below by k (a boundary under the slack
    # alarms constantly) and above by what 48 bars can plausibly accumulate.
    # EXTENDED UPWARD 2026-09-04 for the same reason as threshold_grid: the
    # winner (1.5) sat on the old edge. Probing above confirms a true interior
    # maximum — 1.0 -> 0.0838, 1.5 -> 0.0862, 2.0 -> 0.0847, 2.5 -> 0.0836 —
    # and at k >= 3.0 CUSUM collapses exactly onto the always-quiet floor
    # (precision 0.00462, recall 1.0): slack exceeding all evidence leaves the
    # statistic at zero, so every window ties. A useful coherence check.
    drift_grid: [0.25, 0.5, 1.0, 1.5, 2.0, 2.5]
    # EXTENDED DOWNWARD 2026-09-04. The first grid started at 2.0 and the sweep
    # picked it — the winner sat on the grid's edge, which means the grid, not
    # the data, chose it. Probing below found the real peak at 1.5, with a
    # clean interior maximum: 0.5 -> 0.0839, 1.0 -> 0.0850, 1.5 -> 0.0859,
    # 2.0 -> 0.0853, 3.0 -> 0.0817. Now bracketed on both sides.
    threshold_grid: [0.5, 1.0, 1.5, 2.0, 3.0, 5.0, 8.0]
  gradient_boosting:
    # Gets the WHOLE feature matrix, unlike volume_zscore and cusum which read
    # one column. That is the honest reading of "identical features": the same
    # inputs are available to all four, and each method uses what it uses. The
    # rule bars smuggling in extra data (news features are Phase 8's ablation),
    # not using the matrix a model is meant to use. `is_scheduled` and
    # `item_code` are excluded as label leaks — both describe the event being
    # predicted and are known only once it has happened.
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.05
    # Fixed so a rerun reproduces the reported number exactly; a test asserts
    # two fits on the same data give identical scores.
    random_state: 42
    n_jobs: 4
    # CONTAMINATED BY THE NEGATIVE-SAMPLING DESIGN — measured, not suspected.
    # sampling.quiet_gap_hours is 168 h, so a training negative is by
    # construction never within 7 days of a filing: 0.1% of train negatives
    # have an 8-K in the last week, against 18.9% of train positives. "Recent
    # 8-K" therefore separates the TRAINING classes almost perfectly. At
    # evaluation, where negatives are every quiet bar, 31.5% of them have an
    # 8-K in the last week — so the learned rule is not merely useless there,
    # it is inverted. The model was learning the sampler, not the market.
    # Dropping these two nearly doubles validation precision (0.0257 -> 0.0493,
    # 5.6x -> 10.7x). Both numbers are reported; see work-log entry 54.
    # Only gradient boosting is affected: the other baselines read volume only.
    # Set to [] to reproduce the contaminated result.
    exclude_features: [days_since_last_8k, days_since_last_earnings]

# ------------------------------------------------------------
# The live monitor (Phase 7)
# ------------------------------------------------------------
live:
  # WALL-CLOCK hours after an alert in which a filing counts as following it.
  # NOT decision.horizon_hours, which is also 48 but measured in BARS — a
  # different quantity that happens to share the number. A company can file
  # overnight or at a weekend, so "did a filing follow within two days" is a
  # question about elapsed time. The LEAD TIME recorded is still in trading
  # hours, per rule 3, so both clocks appear and neither is guessed at.
  outcome_window_hours: 48
  # How far BEFORE the newest stored filing to restart the live filing fetch.
  # SEC acceptance times are not strictly ordered against when a record becomes
  # visible, and amendments arrive late, so the fetch deliberately overlaps
  # what it already holds. Re-reading a filing costs nothing — the upsert is
  # idempotent — while missing one at the boundary silently costs an outcome,
  # which is the whole point of the live run.
  filing_overlap_hours: 72

# ------------------------------------------------------------
# Reinforcement learning (Phase 6) — the stopping policy
# ------------------------------------------------------------
rl:
  # Episode order and every stochastic component. Recorded so a run can be
  # reproduced from the seed alone, which P6-03's done-when requires.
  seed: 42
  # Observations are z-scores and returns, so they are centred but unbounded:
  # the frozen snapshot holds bars whose volume_z runs to tens of sigma. A
  # single such bar should not destabilise a network's first layer. Applied
  # AFTER NaN->0, so the neutral sentinel is never clipped away.
  obs_clip: 10.0

  # --- training (P6-03) ---
  algo: PPO                 # discrete two-action space, short episodes, a
                            # terminal-dominated reward — PPO's shape. DQN was
                            # rejected on REPRODUCIBILITY grounds, not
                            # performance: its replay buffer and epsilon
                            # schedule add two more stateful things to seed and
                            # record. See impl/P6-03.
  total_timesteps: 300000
  n_envs: 4
  net_arch: [64, 64]        # 11 inputs; deeper buys nothing here
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  # 1.0, NOT the usual 0.99. Over a 48-step episode 0.99 multiplies a terminal
  # reward by 0.62, making an early flag worth more than a late one — a second,
  # UNSTATED preference for flagging early, stacked on top of r_early_bonus
  # which already says exactly that and is visible where it can be argued with.
  # Episodes are short and finite, so undiscounted returns are well defined and
  # there is no convergence reason to discount.
  gamma: 1.0
  # The observation is 11 floats and the net is two small layers; at that size
  # GPU kernel-launch overhead dominates and CPU is usually faster, which SB3
  # warns about directly. Set to "cuda" on a machine that can see the card.
  device: cpu
  runs_dir: data/runs

# ------------------------------------------------------------
# Evaluation — decide the headline metric FIRST (review §7.4)
# ------------------------------------------------------------
eval:
  # Precision at a fixed alert budget is the headline number. Plain accuracy is
  # meaningless here: the base rate is ~0.3% and "nothing coming" scores 99.7%.
  alert_budget_per_stock_per_month: 2
  report_action_distribution: true # guards against a degenerate always-wait policy
  split_by: [scheduled, unscheduled, item_code]
  calibration: [brier, ece]
  # Bins for the reliability curve and ECE. Ten is the common default: enough
  # resolution to see miscalibration, few enough that each bin holds sample.
  calibration_bins: 10
  t0_variants: [filing, news_adjusted]   # report both, and the gap between them

split:
  train: 0.70
  val: 0.15
  test: 0.15
  method: temporal                 # the last 15% by date, sealed until week 14

logging:
  # A collector cycle that parses zero records must fail loudly. The 2026
  # failure mode was HTTP 200 responses carrying redirect HTML — pipelines
  # looked healthy while writing nothing for days.
  fail_on_zero_records: true
