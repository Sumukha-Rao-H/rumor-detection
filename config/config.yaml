# ============================================================
# Central configuration — ALL knobs live here (plan Appendix B).
# No hardcoded tickers, dates, or paths anywhere in src/.
# All timestamps are UTC everywhere; convert at display time only.
# ============================================================

paths:
  db: "data/db/rumor.db"
  arctic_dumps: "data/raw/arctic_dumps"
  live_json: "data/raw/live_json"
  events: "data/processed/events.parquet"
  states: "data/processed/states"
  llm_cache: "data/llm_cache"
  llm_state: "data/llm_state.json"   # which API keys are cooling, and until when
  symbol_dir: "data/raw/symbol_dir"

subreddits: [wallstreetbets, stocks, StockMarket, investing, pennystocks]

backtest_window:
  start: "2025-01-01"
  # Extended 2026-08-04 from 2026-05-31 to the last day the downloaded dumps
  # actually cover (their newest record is 2026-07-28), gaining two months of
  # events at no collection cost. End is exclusive.
  end: "2026-07-29"

reddit:
  user_agent: "nmamit-major-project-31:v1.0 (academic research)"
  # rotated automatically when one host keeps returning 403 (plan §5.2 fallback a)
  base_urls: ["https://www.reddit.com", "https://old.reddit.com"]
  live_poll_seconds: 300          # poll cycle for reddit_live.py
  live_min_interval_s: 8          # >= 7s between unauthenticated requests
  refetch_hours: [6, 24]          # re-fetch posts at t0+6h / t0+24h for score growth
  listing_limit: 100

arctic_shift:
  api_base: "https://arctic-shift.photon-reddit.com/api"
  min_interval_s: 1.0             # free community service — throttle to <=1 req/sec
  page_limit: 100

market:
  interval: "60m"                 # hourly bars = backtest granularity (~730d of history)
  daily_interval: "1d"
  pad_days_before: 7              # bars must cover [t0 - 7d, t0 + 5d] per event
  pad_days_after: 5
  benchmark: "SPY"
  min_interval_s: 1.0

news:
  gdelt_base: "https://api.gdeltproject.org/api/v2/doc/doc"
  # Measured 2026-08-05: the documented "one call every 5 seconds" still draws
  # 429s under sustained load — at 10s spacing roughly two calls in three were
  # still refused. Pace slower and let Backoff handle what remains.
  gdelt_min_interval_s: 20.0
  finnhub_min_interval_s: 1.1     # free tier ~60 calls/min
  # Finnhub's free company-news archive is a rolling ~12 months. Older requests
  # return an empty list with HTTP 200, so windows past this are skipped rather
  # than mistaken for "no news" (measured: 0 rows at 2025-08, 114 at 2025-09).
  finnhub_lookback_days: 340
  event_pre_hours: 24             # §6.4 window is [t0 - 24h, t0 + 72h]
  max_records: 250                # per merged span; GDELT's ceiling
  whitelist: [reuters.com, bloomberg.com, apnews.com, cnbc.com, wsj.com, ft.com,
              prnewswire.com, businesswire.com, sec.gov]
  # Finnhub's `url` is a redirect through finnhub.io, so the publisher survives
  # only in its `source` field — as a name, not a domain. Without this map every
  # Finnhub headline is attributed to "finnhub.io" and matches no whitelist
  # entry, which would send every recent event to the price/volume rule.
  # Names missing here are slugified and simply fail to match (measured
  # 2026-08-05: the free tier is mostly Yahoo/Benzinga/SeekingAlpha).
  finnhub_source_domains:
    Reuters: reuters.com
    Bloomberg: bloomberg.com
    CNBC: cnbc.com
    "Yahoo": finance.yahoo.com
    MarketWatch: marketwatch.com
    Barrons: barrons.com
    "Barron's": barrons.com
    WSJ: wsj.com
    "The Wall Street Journal": wsj.com
    "Financial Times": ft.com
    "Associated Press": apnews.com
    AP: apnews.com
    PRNewswire: prnewswire.com
    "PR Newswire": prnewswire.com
    Businesswire: businesswire.com
    "Business Wire": businesswire.com
    GlobeNewswire: globenewswire.com
    SEC: sec.gov
    Benzinga: benzinga.com
    SeekingAlpha: seekingalpha.com
    Zacks: zacks.com
    TipRanks: tipranks.com
    Investing.com: investing.com
    Fintel: fintel.io
    ChartMill: chartmill.com

tickers:
  # Both CSVs are generated by `python -m src.pipeline.build_universe`.
  universe_csv: "config/tickers.csv"      # core universe: bare tokens + names
  listed_csv: "config/listed_symbols.csv" # every US-listed symbol: cashtags only
  curated_csv: "config/tickers_curated.csv"  # hand-written seed names, an input
  symbol_dir_urls:
    - "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt"
    - "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"
  core_size: 1500                 # top-N symbols by $cashtag frequency
  core_min_cashtags: 3            # ... and at least this many cashtag posts
  # A company name is matchable as free text only if the ticker co-occurs with
  # it in >=name_match_min_precision of the posts that mention the name
  # (needs >=name_match_min_support posts to judge). Kills "price target"->TGT
  # (0.008) and "on reddit"->RDDT (0.045) while keeping Apple (0.118).
  name_match_min_support: 20
  name_match_min_precision: 0.08
  # quoted: bare ON/OFF/NO/YES are YAML 1.1 booleans
  blacklist: ["A", "ALL", "AI", "ARE", "BE", "BIG", "BUY", "CAN", "CEO", "DD",
              "EDIT", "EV", "FOR", "GO", "IPO", "IT", "LOL", "LOVE", "NOW", "ON",
              "ONE", "OR", "OUT", "PUMP", "RH", "SO", "TV", "U", "UK", "USA",
              "WSB", "YOLO", "IMO", "ATH", "FOMO", "FD", "PT", "EPS", "ER",
              # Empirical extension (plan §6.1 item 3), from reviewing the core
              # universe after the first full extraction run: listed symbols
              # whose mentions are overwhelmingly the ordinary word, not the
              # security ("$USD" 6 posts vs "USD" 1365; ET = Eastern Time).
              "USD", "ET", "UP", "YOU", "ANY", "NEXT", "LOW",
              # Crypto tickers: the mention means the coin, not the listed
              # trust/ETF that shares the symbol. Out of scope for equity rumors.
              "BTC", "ETH", "XRP"]
  max_tickers_per_post: 3         # posts with more distinct tickers are portfolio-spam

rumor_keywords: [merger, acquisition, acquire, buyout, takeover, bankrupt, "chapter 11",
                 delist, halt, FDA, approval, recall, partnership, contract,
                 "earnings leak", insider, SEC, investigation, lawsuit, guidance,
                 "short squeeze", offering, dilution, split]

triage:
  # Free-tier quota decides where a run stops, so seeds are judged in priority
  # order: posts whose *title* carries one of these claim words first. They are
  # the subset of rumor_keywords that name a discrete, checkable corporate
  # event, as opposed to ambient ones ("guidance", "split", "short squeeze")
  # that show up in ordinary market chatter.
  priority_keywords: [merger, acquisition, acquire, buyout, takeover, bankrupt,
                      "chapter 11", delist, halt, FDA, approval, recall,
                      investigation, lawsuit, insider, SEC, "earnings leak"]

labeling:
  # §6.4's "no abnormal sustained price move" test — the only thing standing
  # between "nobody reported it" and a FALSE label, so both thresholds are the
  # plan's, unchanged.
  abnormal_return: 0.04           # |3-day return| below this is 'no move'
  volume_z: 2.0                   # peak daily volume z-score below this too
  return_days: 3
  volume_baseline_days: 20        # trailing window the z-score is measured against
  # A z-score off three days of history is noise. Below this many baseline days
  # the market check reports "unknown" and the event goes to UNVERIFIED rather
  # than being labeled FALSE on the strength of missing data.
  min_baseline_days: 10
  max_headlines: 40               # per event, oldest first; bounds prompt size
  headline_chars: 200
  # Bump when the labeling prompt changes — proposals record it, so a revision
  # re-proposes rather than silently mixing two prompts' verdicts.
  prompt_version: "label-v1"

event:
  gap_hours: 12
  min_posts: 2
  min_solo_score: 50
  label_horizon_hours: 72
  # Index/sector ETFs have no company-specific claim for news to confirm or
  # deny, so they cannot be rumors in the §6.2 sense. Set false to keep them.
  exclude_etfs: true
  # Seed events only from tickers named in the post title when there are any:
  # a $BBAI post that name-drops PLTR is not a PLTR rumor.
  title_ticker_priority: true

state:
  embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  sent_model: "ProsusAI/finbert"
  dim: 418

reward:
  r_correct: 1.0
  r_early_bonus: 0.5
  r_wrong: -2.0
  r_wait: -0.02
  r_timeout: -0.5
  T_max: 48

split:
  train: 0.70
  val: 0.15
  test: 0.15
  method: temporal

llm:
  provider: gemini
  # Deliberately null for triage (2026-08-04). Measured on the same posts,
  # gemini-3.5-flash-lite calls 36% of seed posts rumors and
  # llama-3.3-70b-versatile only 10% — it rejects real checkable claims
  # (an OKLO/NVIDIA collaboration, a $32.2M lease signing, an FDA clearance).
  # Mixing them would make dataset *selection* depend on which model happened
  # to answer. With no fallback the run simply stops when the daily quota is
  # gone and resumes tomorrow. Set to "groq" for non-dataset work (§10 policy
  # baseline), where consistency across events does not matter.
  fallback: null
  min_interval_s: 6               # per-provider default
  temperature: 0                  # plan Appendix D: deterministic labeling
  max_output_tokens: 400
  timeout_s: 90
  quota_failures_before_fallback: 4   # per key, before it is rested
  # How long a key sits out after repeated failures that never said "per day".
  # Short on purpose: it is probably throttling, not exhaustion.
  key_cooldown_s: 900
  # Bump when a prompt changes — it is part of the cache key, so old answers
  # are not silently reused for a different question.
  prompt_version: "triage-v1"
  gemini:
    api_base: "https://generativelanguage.googleapis.com/v1beta"
    # Pinned, not "-latest": a research dataset must be reproducible. Verified
    # available 2026-08-04; 2.5-flash-lite is closed to new keys.
    model: "gemini-3.5-flash-lite"
    # Keys are read from GEMINI_API_KEY, GEMINI_API_KEYS (comma-separated) and
    # GEMINI_API_KEY_1..N — every free key is a separate daily quota, so the
    # pool rotates through them (see src/utils/keypool.py).
    key_env: GEMINI_API_KEY
    min_interval_s: 4.5           # free tier is ~15 req/min, enforced per key
    quota_reset_tz: "America/Los_Angeles"   # daily quota rolls over at PT midnight
  groq:
    api_base: "https://api.groq.com/openai/v1"
    model: "llama-3.3-70b-versatile"
    key_env: GROQ_API_KEY
    min_interval_s: 2.5
    quota_reset_tz: "UTC"
