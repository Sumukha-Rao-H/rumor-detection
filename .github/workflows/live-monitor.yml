# The scheduled live monitor (P7-04).
#
# Runs after the US close on each trading day and, in one pass:
#   1. fetches the price bars that appeared since the last run (yfinance),
#   2. fetches 8-K filings accepted since the last one on record (SEC EDGAR),
#   3. scores the new bars with the tuned detectors,
#   4. appends any alerts to the log,
#   5. backfills outcomes for alerts whose 48-hour window has now elapsed,
#   6. commits the log back to this repository.
#
# Step 2 is not optional. `backfill` can only answer an alert whose whole
# window falls at or before the newest filing held locally, so without a fresh
# filing fetch the horizon never moves and every alert the monitor raises sits
# deferred for ever — it would run for weeks and learn nothing. It also feeds
# the days_since_last_8k feature, which reads the same table.
#
# EDGAR needs no API key, only the descriptive User-Agent already in
# config.http.user_agent, and costs about 0.125s per company — negligible
# beside the bar fetch.
#
# WHY DAILY, NOT HOURLY
# Daily is now a deliberate choice rather than a budget limit. While this
# repository was private, Actions billed against 2,000 free minutes a month:
# the market collector paces itself at one request a second, so a full
# 1,500-ticker pass costs about 25 minutes, daily came to roughly 550 minutes
# and fitted, hourly to about 3,850 and did not.
#
# The repository is now PUBLIC, and public repositories get unlimited minutes
# on GitHub-hosted standard runners, so that constraint is gone. The cadence
# is kept at daily anyway, on purpose: this workflow, the detectors and their
# thresholds were committed BEFORE the bars they are scored on existed, and
# that pre-registration is the whole evidential value of the exercise.
# Changing the sampling cadence part-way through changes the experiment, so it
# is a decision to take deliberately and record, not a free upgrade to take
# because it is now free.
#
# COVERAGE WIDENED 2026-09-07 — READ THIS BEFORE ANALYSING THE ALERT LOG
# Until 2026-09-07 the run passed --max-tickers 400. That was never a sample:
# it is `ORDER BY ticker LIMIT 400`, the alphabetical head of the universe, so
# every alert raised before that date comes from a ticker between A and DIOD.
# The cap existed only for the minute budget that being private imposed, and
# with that gone the restriction was indefensible rather than conservative.
#
# The log therefore has a deliberate discontinuity: alerts/day steps up on
# 2026-09-07, and that step is this change, not the market. It stays
# analysable because every row carries `ticker` and `raised_utc`, so the
# original A-DIOD series can be reconstructed exactly by filtering on those
# two columns.
#
# This widens the evidence and touches no threshold: the detectors, their
# tuned parameters and the scoring code are unchanged, so it cannot flatter a
# result. Narrowing coverage, or moving a threshold, would be a different kind
# of change and is not on the table.
#
# Nothing is lost by running daily: yfinance serves roughly two years of hourly
# history, so a run picks up every hour since the last one. The alert log
# records the BAR time and the moment the monitor noticed it in separate
# columns, so a catch-up run is self-describing.
#
# TWO PUBLIC-REPOSITORY BEHAVIOURS THAT AFFECT THIS CRON
#   * GitHub disables scheduled workflows in a public repository after 60 days
#     with no repository activity, and commits pushed by GITHUB_TOKEN (such as
#     the alert-log commit below) do not reset that clock. If the log ever
#     stops growing, check the Actions tab for a disabled schedule before
#     suspecting the code — a silent gap would damage the out-of-sample record.
#   * Forks have scheduled workflows disabled by default, which is the
#     behaviour we want: a fork must not run this cron and hit the SEC while
#     identifying itself with our contact address.
#
# WHAT THIS IS EVIDENCE OF
# Not live alerting, and the report should not claim it is. It is a
# pre-registered out-of-sample test: the detectors, their thresholds and this
# workflow were committed before these bars existed, and git's timestamps make
# that ordering checkable by someone who does not trust the author.
#
# ONE-TIME SETUP
#   1. .venv/bin/python scripts/build_slim_db.py --out bootstrap.db
#   2. gzip bootstrap.db   (about 31 MB)
#   3. Attach bootstrap.db.gz to a GitHub release in this repository.
#   4. Set the BOOTSTRAP_DB_URL secret to that asset's download URL. Now that
#      the repository is public, a release asset is downloadable anonymously,
#      so the plain browser_download_url of the form
#      https://github.com/OWNER/REPO/releases/download/TAG/bootstrap.db.gz
#      works on its own. The Authorization header is still sent below, which
#      is harmless for a public asset and keeps this working unchanged if the
#      repository is ever made private again.
#      The asset holds companies, bars, filings and events — SEC filings and
#      price bars only. It carries no news articles and no API keys.
#   5. Set the SEC_USER_AGENT secret (see below). Without it the run fails
#      fast, by design, rather than identifying itself to the SEC as nobody.
#   6. Optionally set FINNHUB_API_KEY if news collection is ever added here.

name: live-monitor

on:
  schedule:
    # 21:30 UTC, Monday to Friday — about 90 minutes after the US close
    # (20:00 UTC during EDT, 21:00 during EST), so the day's final hourly bar
    # has settled before the run.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:            # so it can be run by hand without waiting

# Two runs writing the alert log at once would race on the commit.
concurrency:
  group: live-monitor
  cancel-in-progress: false

permissions:
  contents: write               # to commit the alert log back

jobs:
  monitor:
    runs-on: ubuntu-latest
    # The market collector is paced at one request a second, so a full
    # 1,500-ticker pass is ~25 minutes of bar fetching plus ~3 of EDGAR. 60
    # left too little headroom for a retry storm once the cap was removed;
    # minutes are free on a public repository, so the ceiling is generous.
    timeout-minutes: 120

    # The SEC contact address is a secret because this repository is public —
    # config.yaml ships only a placeholder, which the EDGAR client refuses.
    # Job-level so every step that touches EDGAR sees it, including the alert
    # log restore, which imports code that builds a client.
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      # Cheap, before pip and a 31 MB download, so a missing secret costs
      # seconds rather than failing deep in the run.
      - name: Check the SEC contact address is configured
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::SEC_USER_AGENT is unset. The SEC requires a contact"
            echo "address and blocks requests without one; this repository is"
            echo "public so the address is not committed. Add it under"
            echo "Settings > Secrets and variables > Actions, for example:"
            echo "    SEC_USER_AGENT = Your Project Name (you@example.com)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # Only what the monitor needs. The RL and dashboard stacks are heavy
        # and are not on this path.
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy pyyaml requests yfinance \
                      "exchange-calendars==4.13.2" python-dotenv

      # The database is a CACHE. Everything in it can be rebuilt: bars from
      # yfinance, filings from EDGAR. The alert log is the one thing that
      # cannot, and it lives in git, restored below.
      - name: Restore the database cache
        id: dbcache
        uses: actions/cache@v4
        with:
          path: data/db/footprints.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: |
            monitor-db-

      # The miss is detected by looking for the FILE, not by reading a step
      # output. `actions/cache@v4` publishes only `cache-hit`; `cache-matched-key`
      # belongs to `actions/cache/restore`, so the old condition read an output
      # that does not exist, was therefore always '', and bootstrapped on every
      # run — overwriting the very database the cache had just restored. Three
      # runs re-fetched from the April snapshot because of it. `cache-hit` is no
      # use here either: the primary key carries `github.run_id`, so it is unique
      # per run and never an exact hit by construction. The file is the fact.
      - name: Bootstrap the database on a cache miss
        env:
          BOOTSTRAP_DB_URL: ${{ secrets.BOOTSTRAP_DB_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s data/db/footprints.db ]; then
            echo "cache restored $(du -h data/db/footprints.db | cut -f1) of database — skipping bootstrap"
            exit 0
          fi
          if [ -z "$BOOTSTRAP_DB_URL" ]; then
            echo "::error::No cached database and BOOTSTRAP_DB_URL is unset."
            echo "Run scripts/build_slim_db.py, attach the gzipped file to a"
            echo "release, and set the secret. See the header of this workflow."
            exit 1
          fi
          echo "no cached database — seeding from the bootstrap release"
          mkdir -p data/db
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               "$BOOTSTRAP_DB_URL" -o bootstrap.db.gz
          gunzip -c bootstrap.db.gz > data/db/footprints.db
          rm bootstrap.db.gz

      # git is the durable record; the cache is only a speed-up. Importing is
      # a no-op when the cached database already holds these rows, and it
      # never recomputes a hash — a restored row is checked against the hash it
      # was written with, or corruption would verify perfectly.
      - name: Restore the alert log from git
        run: |
          if [ -f live-log/alerts.csv ]; then
            python -c "
          from src import db
          from src.live import import_csv
          from src.utils.config import load_config
          cfg = load_config(); conn = db.get_conn(cfg['paths']['db'])
          print('restored', import_csv(conn, 'live-log/alerts.csv'), 'alert rows')
          "
          fi

      - name: Run the monitor
        env:
          PYTHONPATH: .
        # No --max-tickers: the whole 1,500-company universe is scanned. The
        # flag selected `ORDER BY ticker LIMIT 400`, which is not a sample of
        # the universe but its alphabetical head — every live alert before
        # 2026-09-07 comes from tickers A through DIOD. See the coverage note
        # in the header.
        run: python -m src.live.catchup | tee run.log

      - name: Commit the alert log
        run: |
          git config user.name  "live-monitor"
          git config user.email "live-monitor@users.noreply.github.com"
          git add live-log/alerts.csv
          if git diff --cached --quiet; then
            echo "no new alerts to commit"
          else
            git commit -m "chore(live): alert log $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # Uploaded whatever happened, so a failed run can be diagnosed without
      # re-running it — the failure may not reproduce.
      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 30
