# Docker Compose -- Stock Rumors Dev Stack
# ==========================================
# Brings up PostgreSQL 16 and pgAdmin 4 for local development.
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose down           # stop
#   docker compose down -v        # stop + delete data volume
#
# Schema.sql is auto-mounted to /docker-entrypoint-initdb.d/ so tables
# are created on the very first container start.

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-rumors-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-stock_rumors}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stock-rumors-pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: stock-rumors-pgdata
